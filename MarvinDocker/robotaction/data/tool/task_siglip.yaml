    action_name: "pick"
    arm: "correct"
    speed: 1.0
    correction_mode: "reverse"
    verify:
      source: "siglip"
      expected: "The left gripper approaches the box; the toy and bag remain on the table."
      timeout: 3.0
      stable_frames: 2
      on_failure: "home"
      arm: "copy last one"
  - target: "home"
    action_name: "location"
    arm: "copy last one"
    speed: 1.0
    correction_mode: "forward"
  - target: "home"
    action_name: "location1"
    arm: "copy last one"
    speed: 1.0
    correction_mode: "forward"
