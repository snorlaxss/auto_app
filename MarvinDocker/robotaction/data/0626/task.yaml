tasks:
  - start_record: true
  - target: "yellow box"
    action_name: "pick"
    arm: "correct"
    speed: 0.8
    correction_mode: "forward"
  - stop_record: true  

  - start_record: true
  - target: "white box"
    action_name: "release"
    arm: "right"
    speed: 0.8
    correction_mode: "forward"
  - target: "home"
    action_name: "location_home"
    arm: "right"
    speed: 0.8
    correction_mode: "forward"
  - stop_record: true  


  - start_record: true
  - target: "blue box"
    action_name: "pick"
    arm: "correct"
    speed: 0.8
    correction_mode: "forward"
  - stop_record: true  

  - start_record: true
  - target: "white box"
    action_name: "release_left"
    arm: "left"
    speed: 0.8
    correction_mode: "forward"
  - target: "home"
    action_name: "location_home_left"
    arm: "left"
    speed: 0.8
    correction_mode: "forward"
  - stop_record: true  





