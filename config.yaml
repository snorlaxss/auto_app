siglip:   
  model:
    path: SiglipDocker/model/siglip2-so400m-patch14-224
    checkpoint: SiglipDocker/model/graspanything/model_siglip2_best_eval.pt
    graph_info_file: SiglipDocker/model/graspanything/graph_info_best_eval.json
  inference:
    topk: 5
    image_size: 224
    pad_head_ratio: 0.25
  runtime:
    topic: /siglip/result
    frame_id: camera_rgb_link
    capture_timeout: 2.0
    log_every: 10

marvin:
  object_yaml_path: MarvinDocker/robotaction/data/tool/tool.yaml
  task_yaml_path: MarvinDocker/robotaction/data/tool/task_siglip.yaml
  status_json_path: MarvinDocker/robotaction/data/tool/graph_info.json
  status_topic: /siglip/result
  progress_topic: /control/task_percentage
  object_tf_topic: ""
  base_frame: base_link
  tf_keepalive_hz: 10.0

