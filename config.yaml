siglip:   
  model:
    path: SiglipDocker/model/siglip2-so400m-patch14-224
    checkpoint: SiglipDocker/model/graspanything/0630m6weight/model_siglip2_multiview_v2_best_loss.pt
    graph_info_file: SiglipDocker/model/graspanything/0630m6weight/graph_info_19.json
    multiview: false
    num_views: 3
    num_query_tokens: 8
    pooler_num_layers: 2
    pooler_num_heads: 8
    background_mask_ratio: 0
  inference:
    topk: 5
    image_size: 224
    pad_head_ratio: 0.25
  runtime:
    topic: /siglip/result
    frame_id: camera_rgb_link
    capture_timeout: 2.0
    log_every: 10

marvin:
  object_yaml_path: MarvinDocker/robotaction/data/0626/test_box.yaml
  task_yaml_path: MarvinDocker/robotaction/data/0626/task.yaml 
  status_json_path: MarvinDocker/robotaction/data/0626/gift_m8_ego_0623.json
  status_topic: /siglip2/result
  progress_topic: /control/task_percentage
  object_tf_topic: ""
  base_frame: base_link
  tf_keepalive_hz: 10.0

