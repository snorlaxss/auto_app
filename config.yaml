sam3:
  checkpoint_path: Sam3Docker/model/sam3.1_multiplex.pt
  score_threshold: 0.45
  dedup_iou_threshold: 0.55
  suppress_contained_masks: true
  containment_threshold: 0.85
  bbox_containment_threshold: 0.85
  # containment_min_area_ratio: 1.2
  # prompts: cuboid box,yellow figurine,yellow long tassel, black box
  prompts: yellow box,white box,blue box

