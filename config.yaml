  y_max: 0.5
  y_min: -0.5
  z_min: 0.66
  z_max: 0.75  
rosbag:
  save_path: /home/yang/auto_app/ros2data
  record_mode: per_target
  # record_mode: complete_loop
  stop_timeout_sec: 10.0
